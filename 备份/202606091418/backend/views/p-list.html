<div class="project-list-container" style="font-family: system-ui, -apple-system, sans-serif;">
    <!-- 顶部工具栏 -->
    <div class="page-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; margin-bottom: 24px;">
        <div>
            <h2 class="page-title" style="margin: 0 0 4px 0;">📁 项目列表看板</h2>
            <p class="page-desc" style="margin: 0; color: #64748b;">局域网实时数据同步引擎 (已连接 MySQL)</p>
        </div>
        <div style="display: flex; gap: 12px; align-items: center;">
            <div style="background: #f1f5f9; border-radius: 8px; padding: 2px;">
                <button id="listViewBtn" class="view-switch active" data-view="list" style="border: none; background: transparent; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 500;">📋 列表模式</button>
                <button id="cardViewBtn" class="view-switch" data-view="card" style="border: none; background: transparent; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 500;">🃏 卡片模式</button>
            </div>
            <button id="refreshPListBtn" class="btn" style="background: #2563eb; color: white; border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer;">🔄 刷新数据</button>
        </div>
    </div>

    <!-- 筛选栏 -->
    <div style="background: white; border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border: 1px solid #e2e8f0;">
        <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end;">
            <div style="min-width: 160px;">
                <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155;">产品类别</label>
                <select id="filterCategory" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: white;">
                    <option value="all">所有类别</option>
                </select>
            </div>
            <div style="min-width: 140px;">
                <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155;">年份</label>
                <select id="filterYear" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: white;">
                    <option value="all">所有年份</option>
                </select>
            </div>
            <div style="min-width: 120px;">
                <label style="display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #334155;">月份</label>
                <select id="filterMonth" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: white;">
                    <option value="all">所有月份</option>
                    <option value="1">1月</option><option value="2">2月</option><option value="3">3月</option>
                    <option value="4">4月</option><option value="5">5月</option><option value="6">6月</option>
                    <option value="7">7月</option><option value="8">8月</option><option value="9">9月</option>
                    <option value="10">10月</option><option value="11">11月</option><option value="12">12月</option>
                </select>
            </div>
            <button id="resetFilterBtn" style="background: #f1f5f9; border: 1px solid #cbd5e1; padding: 8px 16px; border-radius: 8px; cursor: pointer;">重置筛选</button>
        </div>
    </div>

    <!-- 项目列表 / 卡片 容器 -->
    <div id="projectListContainer" style="transition: all 0.2s;">
        <div style="text-align: center; padding: 40px; color: #94a3b8;">加载中...</div>
    </div>
</div>

<style>
    .card-mode {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 20px;
    }
    .project-card {
        background: white;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        transition: transform 0.2s, box-shadow 0.2s;
        cursor: pointer;
        border: 1px solid #e2e8f0;
    }
    .project-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 12px 20px -8px rgba(0,0,0,0.15);
    }
    .card-image {
        height: 140px;
        background-size: cover;
        background-position: center;
        background-color: #e2e8f0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        color: #94a3b8;
    }
    .card-body {
        padding: 16px;
    }
    .card-title {
        font-size: 16px;
        font-weight: 700;
        margin-bottom: 6px;
        color: #0f172a;
    }
    .card-code {
        font-family: monospace;
        font-size: 12px;
        color: #64748b;
        margin-bottom: 8px;
    }
    .card-meta {
        display: flex;
        justify-content: space-between;
        font-size: 12px;
        color: #475569;
        margin-top: 12px;
    }
    .list-mode {
        overflow-x: auto;
    }
    .list-mode table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        table-layout: fixed;
    }
    .list-mode th {
        text-align: left;
        padding: 14px 16px;
        background: #f8fafc;
        font-weight: 600;
        color: #334155;
        border-bottom: 1px solid #e2e8f0;
    }
    .list-mode td {
        padding: 12px 16px;
        border-bottom: 1px solid #f1f5f9;
        cursor: pointer;
        transition: background 0.1s;
        vertical-align: middle;
    }
    .list-mode tr:hover td {
        background: #f8fafc;
    }
    .list-mode th:nth-child(1), .list-mode td:nth-child(1) { width: 22%; }
    .list-mode th:nth-child(2), .list-mode td:nth-child(2) { width: 28%; }
    .list-mode th:nth-child(3), .list-mode td:nth-child(3) { width: 18%; }
    .list-mode th:nth-child(4), .list-mode td:nth-child(4) { width: 15%; }
    .list-mode th:nth-child(5), .list-mode td:nth-child(5) { width: 17%; }
    
    .view-switch.active {
        background: white;
        box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
</style>

<script>
    (function() {
        var container = document.getElementById('projectListContainer');
        var listViewBtn = document.getElementById('listViewBtn');
        var cardViewBtn = document.getElementById('cardViewBtn');
        var refreshBtn = document.getElementById('refreshPListBtn');
        var filterCategory = document.getElementById('filterCategory');
        var filterYear = document.getElementById('filterYear');
        var filterMonth = document.getElementById('filterMonth');
        var resetFilterBtn = document.getElementById('resetFilterBtn');

        var currentProjects = [];
        var filteredProjects = [];
        var currentView = 'list';

        // ========== 权限控制函数 ==========
        function getUserPermissions() {
            var session = localStorage.getItem('pm_user_session');
            if (session) {
                try {
                    var user = JSON.parse(session);
                    return user.permissions || [];
                } catch(e) { return []; }
            }
            return [];
        }

        function hasPermission(permission) {
            var permissions = getUserPermissions();
            return permissions.indexOf(permission) !== -1;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        function loadProjects() {
            if (!container) return;
            container.innerHTML = '<div style="text-align: center; padding: 40px;">⏳ 加载项目中...</div>';
            fetch('/api/projects/list')
                .then(function(res) { return res.json(); })
                .then(function(res) {
                    if (res.code === 'SUCCESS') {
                        currentProjects = res.data || [];
                        updateFilterOptions();
                        applyFilter();
                    } else {
                        container.innerHTML = '<div style="color: red; text-align: center; padding: 40px;">❌ 加载失败: ' + escapeHtml(res.detail || '未知错误') + '</div>';
                    }
                })
                .catch(function(err) {
                    container.innerHTML = '<div style="color: red; text-align: center; padding: 40px;">❌ 网络错误: ' + escapeHtml(err.message) + '</div>';
                });
        }

        window.refreshProjectList = function() {
            loadProjects();
        };

        function updateFilterOptions() {
            if (!filterCategory || !filterYear) return;
            var categoriesSet = new Set();
            currentProjects.forEach(function(p) { if(p.category) categoriesSet.add(p.category); });
            var categoryHtml = '<option value="all">所有类别</option>';
            Array.from(categoriesSet).sort().forEach(function(cat) {
                categoryHtml += '<option value="' + escapeHtml(cat) + '">' + escapeHtml(cat) + '</option>';
            });
            filterCategory.innerHTML = categoryHtml;

            var yearsSet = new Set();
            currentProjects.forEach(function(p) {
                var dateStr = p.date || p.created_at || '';
                var year = dateStr ? dateStr.substring(0,4) : '';
                if(year && year.match(/^\d{4}$/)) yearsSet.add(year);
            });
            var yearHtml = '<option value="all">所有年份</option>';
            Array.from(yearsSet).sort().reverse().forEach(function(year) {
                yearHtml += '<option value="' + year + '">' + year + '年</option>';
            });
            filterYear.innerHTML = yearHtml;
        }

        function applyFilter() {
            if (!filterCategory || !filterYear || !filterMonth) return;
            var selectedCategory = filterCategory.value;
            var selectedYear = filterYear.value;
            var selectedMonth = filterMonth.value;

            filteredProjects = currentProjects.filter(function(proj) {
                if (selectedCategory !== 'all' && proj.category !== selectedCategory) return false;
                var dateStr = proj.date || proj.created_at || '';
                var year = dateStr ? dateStr.substring(0,4) : '';
                if (selectedYear !== 'all' && year !== selectedYear) return false;
                if (selectedMonth !== 'all') {
                    var month = dateStr ? parseInt(dateStr.substring(5,7), 10) : null;
                    if (month !== parseInt(selectedMonth, 10)) return false;
                }
                return true;
            });
            renderCurrentView();
        }

        function renderCurrentView() {
            if (!container) return;
            if (currentView === 'list') {
                renderListView();
            } else {
                renderCardView();
            }
        }

        function renderListView() {
            if (!filteredProjects.length) {
                container.innerHTML = '<div style="text-align: center; padding: 60px; color: #94a3b8;">📭 没有找到符合筛选条件的项目</div>';
                return;
            }
            var html = '<div class="list-mode"><table>';
            html += '<thead></tr>';
            html += '<th>项目编码</th>';
            html += '<th>项目名称</th>';
            html += '<th>类别</th>';
            html += '<th>状态</th>';
            html += '<th>创建日期</th>';
            html += '</tr></thead><tbody>';
            
            filteredProjects.forEach(function(proj) {
                var safeCode = escapeHtml(proj.code);
                var safeName = escapeHtml(proj.name);
                html += '<tr onclick="window.open(\'/project-detail?code=' + safeCode + '\', \'_blank\')">';
                html += '<td style="font-family: monospace;">' + safeCode + '</td>';
                html += '<td><strong>' + safeName + '</strong></td>';
                html += '<td>' + escapeHtml(proj.category || '-') + '</td>';
                html += '<td><span style="background:#e0f2fe; padding:2px 8px; border-radius:20px;">' + escapeHtml(proj.status || '未启动') + '</span></td>';
                html += '<td>' + escapeHtml(proj.date || '-') + '</td>';
                html += '</tr>';
            });
            html += '</tbody></table></div>';
            container.innerHTML = html;
        }

        function renderCardView() {
            if (!filteredProjects.length) {
                container.innerHTML = '<div style="text-align: center; padding: 60px; color: #94a3b8;">📭 没有找到符合筛选条件的项目</div>';
                return;
            }
            var html = '<div class="card-mode">';
            filteredProjects.forEach(function(proj) {
                var imageBg = proj.image_url ? 'url(\'' + proj.image_url + '\')' : 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                var safeCode = escapeHtml(proj.code);
                var safeName = escapeHtml(proj.name);
                html += '<div class="project-card" onclick="window.open(\'/project-detail?code=' + safeCode + '\', \'_blank\')">' +
                    '<div class="card-image" style="background: ' + imageBg + '; background-size: cover; background-position: center;">' +
                    (proj.image_url ? '' : '📁') +
                    '</div>' +
                    '<div class="card-body">' +
                    '<div class="card-title">' + safeName + '</div>' +
                    '<div class="card-code">' + safeCode + '</div>' +
                    '<div class="card-meta">' +
                    '<span>🏷️ ' + escapeHtml(proj.category || '未分类') + '</span>' +
                    '<span>📅 ' + escapeHtml(proj.date || '-') + '</span>' +
                    '</div>' +
                    '<div style="margin-top:8px;"><span style="background:#e0f2fe; padding:2px 8px; border-radius:20px; font-size:12px;">' + escapeHtml(proj.status || '未启动') + '</span></div>' +
                    '</div></div>';
            });
            html += '</div>';
            container.innerHTML = html;
        }

        function setView(view) {
            currentView = view;
            if (view === 'list') {
                listViewBtn.classList.add('active');
                cardViewBtn.classList.remove('active');
            } else {
                cardViewBtn.classList.add('active');
                listViewBtn.classList.remove('active');
            }
            renderCurrentView();
        }

        function resetFilters() {
            filterCategory.value = 'all';
            filterYear.value = 'all';
            filterMonth.value = 'all';
            applyFilter();
        }

        if (listViewBtn) listViewBtn.addEventListener('click', function() { setView('list'); });
        if (cardViewBtn) cardViewBtn.addEventListener('click', function() { setView('card'); });
        if (refreshBtn) refreshBtn.addEventListener('click', loadProjects);
        if (filterCategory) filterCategory.addEventListener('change', applyFilter);
        if (filterYear) filterYear.addEventListener('change', applyFilter);
        if (filterMonth) filterMonth.addEventListener('change', applyFilter);
        if (resetFilterBtn) resetFilterBtn.addEventListener('click', resetFilters);

        loadProjects();
        setView('list');
    })();
</script>
