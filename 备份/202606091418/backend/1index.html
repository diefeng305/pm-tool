<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">项目管理系统 V2.7</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #0f172a; color: #1e293b; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        .hidden { display: none !important; }
        
        /* 亮色主题变量 */
        body[data-theme="light"] {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --text-primary: #1e293b;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
        }
        
        /* 暗色主题变量 */
        body[data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #334155;
        }
        
        /* 跟随系统 */
        @media (prefers-color-scheme: dark) {
            body[data-theme="auto"] {
                --bg-primary: #0f172a;
                --bg-secondary: #1e293b;
                --text-primary: #f1f5f9;
                --text-secondary: #94a3b8;
                --border-color: #334155;
            }
        }
        @media (prefers-color-scheme: light) {
            body[data-theme="auto"] {
                --bg-primary: #f8fafc;
                --bg-secondary: #ffffff;
                --text-primary: #1e293b;
                --text-secondary: #64748b;
                --border-color: #e2e8f0;
            }
        }
        
        .login-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #0f172a; display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: #ffffff !important; padding: 40px; border-radius: 12px; width: 90%; max-width: 400px; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5); text-align: center; color: #0f172a !important; }
        .login-box h2 { font-size: 28px; margin-bottom: 10px; color: #0f172a !important; font-weight: 700; }
        .login-box p { color: #64748b !important; font-size: 14px; margin-bottom: 30px; }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; margin-bottom: 6px; color: #334155 !important; }
        .form-group input, .form-group select { width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 16px; outline: none; color: #0f172a !important; background-color: #ffffff !important; }
        .form-group input:focus { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
        .btn { width: 100%; padding: 12px; background: #2563eb; color: white !important; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 10px; display: block; }
        .btn:hover { background: #1d4ed8; }
        .btn-secondary { background: #64748b; }
        .btn-secondary:hover { background: #475569; }
        
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.7); display: flex; align-items: center; justify-content: center; z-index: 100000; backdrop-filter: blur(4px); }
        .modal-box { background: white !important; padding: 35px; border-radius: 12px; max-width: 550px; width: 100%; border-top: 5px solid #2563eb; color: #0f172a !important; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); }
        .modal-box h3 { font-size: 20px; color: #0f172a !important; margin-bottom: 12px; font-weight: 700; text-align: left; }
        .modal-box p { font-size: 14px; color: #64748b !important; margin-bottom: 20px; line-height: 1.5; text-align: left; }
        .modal-close-btn { position: absolute; top: 15px; right: 20px; background: none; border: none; font-size: 22px; color: #94a3b8; cursor: pointer; }
        .modal-footer { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }

        header { height: 70px; background: var(--bg-secondary); color: var(--text-primary); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--border-color); }
        .logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
        .logo img { height: 50px; width: auto; max-width: 240px; object-fit: contain; }
        .logo-text { font-size: 20px; font-weight: 800; color: #38bdf8; letter-spacing: 1px; }
        .nav-wrapper { margin-left: 80px; }
        nav { display: flex; gap: 8px; }
        .nav-btn { padding: 8px 16px; background: transparent; color: var(--text-secondary); border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .nav-btn.active { background: #2563eb; color: white; }
        .user-info { display: flex; align-items: center; gap: 15px; font-size: 14px; color: var(--text-primary); }
        .badge { background: var(--bg-primary); padding: 4px 12px; border-radius: 20px; color: var(--text-secondary); border: 1px solid var(--border-color); }
        .logout-btn { color: var(--text-secondary); background: none; border: none; cursor: pointer; }

        .main-container { display: flex; flex: 1; overflow: hidden; background-color: var(--bg-primary); }
        aside { width: 260px; background: var(--bg-secondary); border-right: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; gap: 8px; transition: all 0.2s; }
        .aside-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; margin-bottom: 10px; padding-left: 10px; }
        .sub-btn { width: 100%; text-align: left; padding: 10px 14px; background: transparent; border: none; border-radius: 8px; font-size: 14px; color: var(--text-primary); cursor: pointer; }
        .sub-btn.active { background: var(--bg-primary); color: #2563eb; font-weight: 600; }

        main { flex: 1; padding: 30px; overflow-y: auto; background-color: var(--bg-primary); color: var(--text-primary); text-align: left; transition: all 0.2s; }
        .hide-sidebar aside { display: none; }
        .hide-sidebar main { width: 100%; padding: 0; }
        
        .page-header { border-bottom: 1px solid var(--border-color); padding-bottom: 16px; margin-bottom: 24px; }
        .page-title { font-size: 22px; font-weight: 700; color: var(--text-primary); }
        .page-desc { color: var(--text-secondary); margin-top: 4px; }
        .content-block { background: var(--bg-secondary); padding: 24px; border-radius: 12px; border: 1px solid var(--border-color); }
        
        .logo-upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            margin-top: 16px;
            transition: all 0.2s;
        }
        .logo-upload-area:hover {
            background: var(--bg-primary);
            border-color: #2563eb;
        }
        .current-logo-preview {
            width: 100px;
            height: 80px;
            background: var(--bg-primary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-bottom: 16px;
        }
        .current-logo-preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .logo-tip {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }
        .settings-group {
            border-top: 1px solid var(--border-color);
            padding-top: 20px;
            margin-top: 20px;
        }
        .settings-group-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
        }
    </style>
</head>
<body data-theme="light">

    <div id="login-page" class="login-container">
        <div class="login-box">
            <h2 id="loginSystemName">系统登录</h2>
            <p id="loginSubtitle">模块化项目管理平台</p>
            <div class="form-group">
                <label>电子邮箱 / 账号</label>
                <input type="text" id="login-username" placeholder="请输入账号">
            </div>
            <div class="form-group">
                <label>登录密码</label>
                <input type="password" id="login-password" placeholder="请输入密码">
            </div>
            <button type="button" id="login-submit-btn" class="btn">安全登录</button>
        </div>
    </div>

    <div id="pwd-modal" class="modal hidden">
        <div class="modal-box">
            <h3>⚠️ 安全合规强制提示</h3>
            <p>您当前使用的是系统默认初始密码，为了安全起见，请必须修改初始密码后才可登录系统。</p>
            <div class="form-group">
                <label>旧密码</label>
                <input type="password" value="admin111" disabled style="background:#f1f5f9;color:#94a3b8;">
            </div>
            <div class="form-group">
                <label>设置新密码</label>
                <input type="password" id="pwd-new" placeholder="请输入长度不少于 6 位的新密码">
            </div>
            <button type="button" id="pwd-save-btn" class="btn" style="background:#dc2626;">确认修改并解锁登录</button>
        </div>
    </div>

    <div id="p-create-denied-modal" class="modal hidden">
        <div class="modal-box" style="border-top-color: #dc2626;">
            <button type="button" class="modal-close-btn cls-mdl-trigger">×</button>
            <h3 style="color:#dc2626;">⚠️ 权限校验拦截</h3>
            <p>并不是所有用户都可以新建项目，只有有权限的用户才可以。</p>
            <div class="doc-box">
                <strong>📋 新建项目页设计功能要求说明：</strong><br>
                1. 前端级联机制：非"系统管理员"角色时，点击会精准弹出本说明浮窗。<br>
                2. 支持临时演练：可点击下方按钮切换为高权限身份直接在线测试弹窗表单。
            </div>
            <div class="modal-footer">
                <button type="button" class="btn cls-mdl-trigger" style="background:#64748b; margin-top:0; width:auto;">关闭</button>
                <button type="button" id="mock-admin-btn" class="btn" style="margin-top:0; width:auto;">⚙️ 模拟管理员身份</button>
            </div>
        </div>
    </div>

    <div id="main-dashboard" class="hidden" style="display:flex; flex-direction:column; flex:1; height:100%;">
        <header>
            <div style="display:flex; align-items:center;">
                <div id="logoContainer" class="logo">
                    <img id="logoImage" src="" alt="Logo" style="display: none;">
                    <span id="logoText" class="logo-text">📦 PM_SYSTEM</span>
                </div>
                <div class="nav-wrapper">
                    <nav>
                        <button type="button" id="nav-dashboard" class="nav-btn">📊 仪表盘</button>
                        <button type="button" id="nav-project" class="nav-btn">项目中心</button>
                        <button type="button" id="nav-task" class="nav-btn">任务中心</button>
                        <button type="button" id="nav-setting" class="nav-btn">系统设置</button>
                    </nav>
                </div>
            </div>
            <div class="user-info">
                <span id="user-badge" class="badge">加载中...</span>
                <button type="button" id="logout-trigger-btn" class="logout-btn">退出系统</button>
            </div>
        </header>

        <div class="main-container">
            <aside>
                <div id="aside-title-text" class="aside-title">功能导航</div>
                <div id="sub-menu-container"></div>
            </aside>
            <main id="main-content-view"></main>
        </div>
    </div>

    <div id="globalModalContainer" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(15, 23, 42, 0.7); z-index: 99999; backdrop-filter: blur(4px); align-items: center; justify-content: center;"></div>

<script>
        var API_BASE = window.location.origin;
        var currentUserId = null;
        var currentUserRole = "普通成员";
        var currentUserPermissions = [];
        var isInitialLoading = true;
        var systemConfig = { logo_text: '📦 PM_SYSTEM', system_name: '项目管理系统', language: 'zh', theme: 'light', logo_url: '' };
        var userPreferences = { language: 'zh', theme: 'light' };

        // 加载系统配置（全局配置，只有管理员可修改）
        function loadSystemConfig() {
            fetch(API_BASE + '/api/config/')
                .then(function(res) { return res.json(); })
                .then(function(res) {
                    if (res.code === 'SUCCESS' && res.data) {
                        systemConfig = res.data;
                        applySystemConfig();
                    }
                })
                .catch(function(err) { console.error('加载系统配置失败:', err); });
        }

        // 加载用户个人偏好
        function loadUserPreferences() {
            var savedPrefs = localStorage.getItem('pm_user_preferences');
            if (savedPrefs) {
                try {
                    userPreferences = JSON.parse(savedPrefs);
                } catch(e) {}
            }
            if (userPreferences.theme) {
                document.body.setAttribute('data-theme', userPreferences.theme);
            }
            if (userPreferences.language) {
                // 语言切换功能后续完善
            }
        }

        // 保存用户偏好
        function saveUserPreferences() {
            localStorage.setItem('pm_user_preferences', JSON.stringify(userPreferences));
        }

        // 应用系统配置到界面
        function applySystemConfig() {
            // 应用 Logo
            if (systemConfig.logo_url) {
                var logoImg = document.getElementById('logoImage');
                var logoTextSpan = document.getElementById('logoText');
                if (logoImg && logoTextSpan) {
                    logoImg.src = systemConfig.logo_url;
                    logoImg.style.display = 'block';
                    logoTextSpan.style.display = 'none';
                }
            } else {
                var logoImg2 = document.getElementById('logoImage');
                var logoTextSpan2 = document.getElementById('logoText');
                if (logoImg2 && logoTextSpan2) {
                    logoImg2.style.display = 'none';
                    logoTextSpan2.style.display = 'block';
                    logoTextSpan2.innerHTML = systemConfig.logo_text || '📦 PM_SYSTEM';
                }
            }
            
            // 应用系统名称到标题和登录页
            var systemName = systemConfig.system_name || '项目管理系统';
            document.title = systemName;
            var loginTitle = document.getElementById('loginSystemName');
            if (loginTitle) loginTitle.innerHTML = systemName;
        }

        // 上传 Logo
        function uploadLogo(file) {
            var formData = new FormData();
            formData.append('file', file);
            
            var username = localStorage.getItem('pm_user_session') ? 
                JSON.parse(localStorage.getItem('pm_user_session')).username : '';
            
            fetch(API_BASE + '/api/config/upload-logo', {
                method: 'POST',
                headers: { 'X-Username': username },
                body: formData
            })
            .then(function(res) { return res.json(); })
            .then(function(res) {
                if (res.code === 'SUCCESS') {
                    alert('Logo 上传成功！');
                    loadSystemConfig();
                } else {
                    alert('上传失败: ' + (res.detail || '未知错误'));
                }
            })
            .catch(function(err) { alert('网络错误: ' + err.message); });
        }

        // 保存系统配置（系统名称 - 仅管理员）
        function saveSystemConfig(systemName, callback) {
            var payload = { system_name: systemName };
            
            var username = localStorage.getItem('pm_user_session') ? 
                JSON.parse(localStorage.getItem('pm_user_session')).username : '';
            
            fetch(API_BASE + '/api/config/', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'X-Username': username
                },
                body: JSON.stringify(payload)
            })
            .then(function(res) { return res.json(); })
            .then(function(res) {
                if (res.code === 'SUCCESS') {
                    if (callback) callback(true);
                } else {
                    alert('保存失败: ' + (res.detail || '未知错误'));
                    if (callback) callback(false);
                }
            })
            .catch(function(err) {
                alert('网络错误: ' + err.message);
                if (callback) callback(false);
            });
        }

        function getUserPermissions() {
            return currentUserPermissions;
        }

        function hasPermission(permission) {
            if (currentUserRole === '系统管理员') {
                return true;
            }
            return currentUserPermissions.indexOf(permission) !== -1;
        }

        document.addEventListener('click', function(e) {
            var targetId = e.target.id;
            
            if (targetId === 'login-submit-btn') { executeLogin(); return; }
            if (targetId === 'pwd-save-btn') { handleForceChangePassword(); return; }
            if (targetId === 'nav-dashboard') { switchTab('dashboard'); return; }
            if (targetId === 'nav-project') { switchTab('project'); return; }
            if (targetId === 'nav-task') { switchTab('task'); return; }
            if (targetId === 'nav-setting') { switchTab('setting'); return; }
            if (targetId === 'logout-trigger-btn') { handleLogout(); return; }
            
            if (targetId === 'sub-p-list') { renderContent('p-list'); return; }
            if (targetId === 'sub-p-create') { openCreateProjectModal(); return; }
            if (targetId === 'sub-p-archive') { renderContent('p-archive'); return; }
            if (targetId === 'sub-p-search') { renderContent('p-search'); return; }
            
            if (targetId === 'sub-t-all') { renderContent('t-all'); return; }
            if (targetId === 'sub-t-my') { renderContent('t-my'); return; }
            if (targetId === 'sub-t-completed') { renderContent('t-completed'); return; }
            
            if (targetId === 'sub-s-base') { renderContent('s-base'); return; }
            if (targetId === 'sub-s-user') { renderContent('s-user'); return; }
            
            if (targetId === 'mock-admin-btn') {
                currentUserRole = '系统管理员';
                currentUserPermissions = ['create_project', 'delete_project', 'create_task', 'delete_task', 'audit_flow', 'manage_users', 'view_all_projects', 'system_settings'];
                var sessionData = { username: 'admin_mock', role: 'admin', name: '模拟管理员', permissions: currentUserPermissions };
                localStorage.setItem('pm_user_session', JSON.stringify(sessionData));
                closeAllModals();
                alert('已成功模拟管理员权限！您现在可以新建项目了。');
                return;
            }

            if (e.target.classList.contains('cls-mdl-trigger') || e.target.classList.contains('modal-close-btn')) {
                closeAllModals();
            }
        });

        window.addEventListener('DOMContentLoaded', function() {
            loadSystemConfig();
            loadUserPreferences();
            
            var savedUser = localStorage.getItem('pm_user_session');
            if (savedUser) {
                try {
                    var user = JSON.parse(savedUser);
                    
                    if (user.username === 'admin' || user.role === 'admin' || user.role === '系统管理员') {
                        currentUserRole = '系统管理员';
                        currentUserPermissions = ['create_project', 'delete_project', 'create_task', 'delete_task', 'audit_flow', 'manage_users', 'view_all_projects', 'system_settings'];
                    } else {
                        currentUserRole = user.role || '普通成员';
                        currentUserPermissions = user.permissions || [];
                    }
                    
                    enterSystem(user);
                } catch (e) {
                    localStorage.removeItem('pm_user_session');
                }
            }

            var uInput = document.getElementById('login-username');
            var pInput = document.getElementById('login-password');
            var pwdNewInput = document.getElementById('pwd-new');

            if(uInput) uInput.addEventListener('keydown', handleEnterKey);
            if(pInput) pInput.addEventListener('keydown', handleEnterKey);
            
            if(pwdNewInput) {
                pwdNewInput.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter') {
                        event.preventDefault();
                        handleForceChangePassword();
                    }
                });
            }
        });

        function handleEnterKey(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                executeLogin();
            }
        }

        function executeLogin() {
            var u = document.getElementById('login-username').value;
            var p = document.getElementById('login-password').value;
            if(!u || !p) { alert('请输入账号与密码'); return; }

            fetch(API_BASE + '/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            })
            .then(function(res) { return res.json(); })
            .then(function(res) {
                if(res.code === "SUCCESS") {
                    currentUserId = res.username;
                    
                    if (res.username === 'admin' || res.role === 'admin') {
                        currentUserRole = '系统管理员';
                        currentUserPermissions = ['create_project', 'delete_project', 'create_task', 'delete_task', 'audit_flow', 'manage_users', 'view_all_projects', 'system_settings'];
                    } else {
                        currentUserRole = '普通成员';
                        currentUserPermissions = res.permissions || [];
                    }
                    
                    document.getElementById('user-badge').innerText = res.name + ' (' + currentUserRole + ')';
                    document.getElementById('login-page').classList.add('hidden');
                    document.getElementById('main-dashboard').classList.remove('hidden');
                    
                    var sessionData = { 
                        username: res.username, 
                        role: currentUserRole, 
                        name: res.name, 
                        permissions: currentUserPermissions 
                    };
                    localStorage.setItem('pm_user_session', JSON.stringify(sessionData));
                    
                    switchTab('dashboard');
                } else {
                    alert("验证失败: " + (res.detail || '未知错误'));
                }
            })
            .catch(function(err) { alert("通信异常: " + err.message); });
        }
    
        function handleForceChangePassword() {
            var newPassword = document.getElementById('pwd-new').value;
            if (!newPassword || newPassword.length < 6) {
                alert('新密码长度不能少于 6 位');
                return;
            }
            
            fetch(API_BASE + '/api/auth/change-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: currentUserId, old_password: 'admin111', new_password: newPassword })
            })
            .then(function(response) {
                if (response.ok) {
                    alert('密码修改成功！请使用新密码重新执行安全登录。');
                    document.getElementById('login-password').value = '';
                    document.getElementById('pwd-new').value = '';
                    document.getElementById('pwd-modal').classList.add('hidden');
                } else {
                    alert('修改失败，请检查规范。');
                }
            })
            .catch(function(err) { alert('请求异常'); });
        }

        function enterSystem(user) {
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('main-dashboard').classList.remove('hidden');
            document.getElementById('user-badge').innerText = user.username + " (" + currentUserRole + ")";
            
            var savedTab = localStorage.getItem('pm_current_tab');
            var savedSubView = localStorage.getItem('pm_current_sub_view');
            
            if (savedTab) {
                switchTab(savedTab);
                if (savedSubView && savedSubView !== 'p-list') {
                    renderContent(savedSubView);
                }
            } else {
                switchTab('dashboard');
            }
            
            isInitialLoading = false;
        }

        function handleLogout() {
            localStorage.removeItem('pm_user_session');
            localStorage.removeItem('pm_current_tab');
            localStorage.removeItem('pm_current_sub_view');
            window.location.reload();
        }

        function switchTab(tabName) {
            if (!isInitialLoading) {
                localStorage.setItem('pm_current_tab', tabName);
            }

            var dashboardContainer = document.getElementById('main-dashboard');
            if (tabName === 'dashboard') {
                dashboardContainer.classList.add('hide-sidebar');
            } else {
                dashboardContainer.classList.remove('hide-sidebar');
            }

            var tabs = ['dashboard', 'project', 'task', 'setting'];
            for (var i = 0; i < tabs.length; i++) {
                var t = tabs[i];
                var btn = document.getElementById('nav-' + t);
                if (btn) {
                    if (t === tabName) btn.classList.add('active');
                    else btn.classList.remove('active');
                }
            }

            var subContainer = document.getElementById('sub-menu-container');
            if (!subContainer) return;

            var targetSubView = localStorage.getItem('pm_current_sub_view') || '';

            if (tabName === 'dashboard') {
                document.getElementById('aside-title-text').innerText = "数据看板";
                subContainer.innerHTML = '';
                renderContent('dashboard');
            } else if (tabName === 'project') {
                document.getElementById('aside-title-text').innerText = "项目管理菜单";
                subContainer.innerHTML = '<button type="button" id="sub-p-list" class="sub-btn">📁 项目列表</button><button type="button" id="sub-p-create" class="sub-btn">➕ 新建项目</button><button type="button" id="sub-p-archive" class="sub-btn">📦 项目归档</button><button type="button" id="sub-p-search" class="sub-btn">🔍 搜索项目</button>';
                
                if (targetSubView && targetSubView.indexOf('p-') === 0) {
                    renderContent(targetSubView);
                } else {
                    renderContent('p-list');
                }
            } 
            else if (tabName === 'task') {
                document.getElementById('aside-title-text').innerText = "任务管理菜单";
                subContainer.innerHTML = '<button type="button" id="sub-t-all" class="sub-btn">📋 全部任务</button><button type="button" id="sub-t-my" class="sub-btn">👤 指派给我的任务</button><button type="button" id="sub-t-completed" class="sub-btn">✅ 已完成的任务</button>';
                
                if (targetSubView && targetSubView.indexOf('t-') === 0) {
                    renderContent(targetSubView);
                } else {
                    renderContent('t-all');
                }
            } 
            else if (tabName === 'setting') {
                document.getElementById('aside-title-text').innerText = "系统配置菜单";
                subContainer.innerHTML = '<button type="button" id="sub-s-base" class="sub-btn">⚙️ 系统设置</button><button type="button" id="sub-s-user" class="sub-btn">👥 用户管理</button>';
                
                if (targetSubView && targetSubView.indexOf('s-') === 0) {
                    renderContent(targetSubView);
                } else {
                    renderContent('s-base');
                }
            }
        }

        function openCreateProjectModal() {
            if (!hasPermission('create_project')) {
                document.getElementById('p-create-denied-modal').classList.remove('hidden');
                return;
            }

            fetch('/views/project_create.html')
                .then(function(response) {
                    if (!response.ok) throw new Error('未找到新建项目组件网页文件');
                    return response.text();
                })
                .then(function(html) {
                    var container = document.getElementById('globalModalContainer');
                    container.innerHTML = html;
                    container.style.display = 'flex';
                    
                    var scripts = container.querySelectorAll('script');
                    for (var i = 0; i < scripts.length; i++) {
                        var oldScript = scripts[i];
                        var newScript = document.createElement('script');
                        newScript.textContent = oldScript.textContent;
                        document.body.appendChild(newScript);
                    }
                })
                .catch(function(err) { alert('加载失败: ' + err.message); });
        }

        function closeGlobalModal() {
            var container = document.getElementById('globalModalContainer');
            if (container) {
                container.style.display = 'none';
                container.innerHTML = '';
            }
        }

        function closeAllModals() {
            document.getElementById('p-create-denied-modal').classList.add('hidden');
            document.getElementById('pwd-modal').classList.add('hidden');
            closeGlobalModal();
        }

        function loadView(url, callback) {
            fetch(url)
                .then(function(response) {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.text();
                })
                .then(function(html) {
                    var mainContent = document.getElementById('main-content-view');
                    mainContent.innerHTML = html;
                    
                    var scripts = mainContent.querySelectorAll('script');
                    for (var i = 0; i < scripts.length; i++) {
                        var oldScript = scripts[i];
                        var newScript = document.createElement('script');
                        if (oldScript.src) {
                            newScript.src = oldScript.src;
                        } else {
                            newScript.textContent = oldScript.textContent;
                        }
                        document.body.appendChild(newScript);
                    }
                    
                    // 对于仪表盘，触发刷新事件
                    if (url.indexOf('dashboard.html') !== -1) {
                        setTimeout(function() {
                            var refreshEvent = new CustomEvent('dashboard-reloaded');
                            window.dispatchEvent(refreshEvent);
                        }, 100);
                    }
                    
                    if (callback) callback();
                })
                .catch(function(err) {
                    var mainContent = document.getElementById('main-content-view');
                    mainContent.innerHTML = '<div class="content-block" style="color:red;">加载失败: ' + err.message + '</div>';
                });
        }

        function renderContent(viewType) {
            if (viewType === 's-user' && !hasPermission('manage_users')) {
                alert('权限不足，无法访问用户管理中心。');
                return;
            }
            localStorage.setItem('pm_current_sub_view', viewType);

            var btns = document.querySelectorAll('.sub-btn');
            for (var i = 0; i < btns.length; i++) {
                btns[i].classList.remove('active');
            }
            var activeSub = document.getElementById('sub-' + viewType);
            if (activeSub) activeSub.classList.add('active');

            switch(viewType) {
                case 'dashboard':
                    loadView('/views/dashboard.html');
                    break;
                case 'p-list':
                    loadView('/views/p-list.html');
                    break;
                case 'p-archive':
                    loadView('/views/p-archive.html');
                    break;
                case 'p-search':
                    loadView('/views/p-search.html');
                    break;
                case 's-user':
                    loadView('/views/user_management.html');
                    break;
                case 't-all':
                    loadView('/views/task_center.html', function() {
                        if (window.setTaskView) window.setTaskView('all');
                    });
                    break;
                case 't-my':
                    loadView('/views/task_center.html', function() {
                        if (window.setTaskView) window.setTaskView('my');
                    });
                    break;
                case 't-completed':
                    loadView('/views/task_center.html', function() {
                        if (window.setTaskView) window.setTaskView('completed');
                    });
                    break;
                case 's-base':
                    loadSystemSettingsPage();
                    break;
                default:
                    document.getElementById('main-content-view').innerHTML = '<div class="content-block"><p>功能开发中...</p></div>';
            }
        }
        
        // 系统设置页面
        function loadSystemSettingsPage() {
            var isAdmin = currentUserRole === '系统管理员';
            
            var logoUrl = systemConfig.logo_url || '';
            var logoHtml = '';
            if (logoUrl) {
                logoHtml = '<div class="current-logo-preview"><img src="' + logoUrl + '" alt="当前Logo"></div>';
            } else {
                logoHtml = '<div class="current-logo-preview"><span style="font-size: 48px;">📦</span></div>';
            }
            
            var html = '<div class="page-header"><h2 class="page-title">⚙️ 系统设置</h2><p class="page-desc">配置系统外观和语言</p></div>' +
                '<div class="content-block">' +
                '<div class="settings-group"><div class="settings-group-title">🔧 系统配置（仅管理员）</div>' +
                '<div class="form-group"><label>🏷️ 系统名称</label><input type="text" id="systemNameInput" value="' + escapeHtml(systemConfig.system_name || '项目管理系统') + '" ' + (isAdmin ? '' : 'disabled') + ' style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:8px;"></div>' +
                '<div class="form-group"><label>🖼️ 自定义 Logo</label>' +
                logoHtml +
                (isAdmin ? '<div class="logo-upload-area" id="logoUploadArea">📁 点击上传 Logo 图片<br><span class="logo-tip">推荐尺寸：400x120 像素，支持 PNG、JPG、SVG 格式</span></div>' : '<div style="margin-top:12px; padding:12px; background:var(--bg-primary); border-radius:8px; color:var(--text-secondary);">🔒 只有管理员可以修改 Logo</div>') +
                '</div>' +
                (isAdmin ? '<button class="btn" type="button" id="saveSystemConfigBtn" style="width:auto; padding:12px 30px; margin-top:20px;">💾 保存系统名称</button>' : '') +
                '</div>' +
                '<div class="settings-group"><div class="settings-group-title">🎨 个人偏好（每个用户独立）</div>' +
                '<div class="form-group"><label>🌐 界面语言</label><select id="languageSelect" style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:8px;"><option value="zh" ' + (userPreferences.language === 'zh' ? 'selected' : '') + '>中文</option><option value="en" ' + (userPreferences.language === 'en' ? 'selected' : '') + '>English</option></select><div class="logo-tip">⚠️ 语言切换功能开发中</div></div>' +
                '<div class="form-group"><label>🎨 主题背景</label><select id="themeSelect" style="width:100%; padding:10px; border:1px solid var(--border-color); border-radius:8px;"><option value="light" ' + (userPreferences.theme === 'light' ? 'selected' : '') + '>亮色模式</option><option value="dark" ' + (userPreferences.theme === 'dark' ? 'selected' : '') + '>暗色模式</option><option value="auto" ' + (userPreferences.theme === 'auto' ? 'selected' : '') + '>跟随系统</option></select></div>' +
                '<button class="btn" type="button" id="saveUserPrefsBtn" style="width:auto; padding:12px 30px; margin-top:20px;">💾 保存个人偏好</button>' +
                '</div></div>';
            
            document.getElementById('main-content-view').innerHTML = html;
            
            // 绑定 Logo 上传事件
            if (isAdmin) {
                var uploadArea = document.getElementById('logoUploadArea');
                if (uploadArea) {
                    uploadArea.addEventListener('click', function() {
                        var input = document.createElement('input');
                        input.type = 'file';
                        input.accept = 'image/png,image/jpeg,image/jpg,image/svg+xml';
                        input.onchange = function(e) {
                            var file = e.target.files[0];
                            if (file) {
                                uploadLogo(file);
                            }
                        };
                        input.click();
                    });
                }
            }
            
            // 保存系统名称按钮
            if (isAdmin) {
                var saveSysBtn = document.getElementById('saveSystemConfigBtn');
                if (saveSysBtn) {
                    saveSysBtn.addEventListener('click', function() {
                        var newSystemName = document.getElementById('systemNameInput').value;
                        saveSystemConfig(newSystemName, function(success) {
                            if (success) {
                                alert('系统名称保存成功！页面将刷新。');
                                location.reload();
                            }
                        });
                    });
                }
            }
            
            // 保存个人偏好按钮
            var savePrefsBtn = document.getElementById('saveUserPrefsBtn');
            if (savePrefsBtn) {
                savePrefsBtn.addEventListener('click', function() {
                    userPreferences.language = document.getElementById('languageSelect').value;
                    userPreferences.theme = document.getElementById('themeSelect').value;
                    saveUserPreferences();
                    document.body.setAttribute('data-theme', userPreferences.theme);
                    alert('个人偏好保存成功！');
                });
            }
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
    </script>
</body>
</html>
