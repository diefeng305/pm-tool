<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>任务中心 - 未完成任务</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            padding: 0;
            color: #1e293b;
        }
        .task-container {
            width: 100%;
            margin: 0;
            padding: 20px 24px;
        }
        .task-stats {
            display: flex;
            gap: 20px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 16px 24px;
            flex: 1;
            min-width: 150px;
            border: 1px solid #e2e8f0;
        }
        .stat-card .number {
            font-size: 28px;
            font-weight: 700;
            color: #2563eb;
        }
        .stat-card .label {
            font-size: 14px;
            color: #64748b;
            margin-top: 4px;
        }
        .filters-bar {
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 20px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            align-items: center;
            border: 1px solid #e2e8f0;
        }
        .filters-bar select, .filters-bar button {
            padding: 8px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            font-size: 14px;
        }
        .filters-bar button {
            background: #2563eb;
            color: white;
            border: none;
        }
        .task-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }
        .task-card {
            background: white;
            border-radius: 16px;
            border: 1px solid #e2e8f0;
            overflow: hidden;
            transition: all 0.2s;
            cursor: pointer;
        }
        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        .task-card-header {
            padding: 16px;
            border-bottom: 1px solid #e2e8f0;
            background: #f8fafc;
        }
        .task-title {
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 8px;
            color: #0f172a;
        }
        .task-meta {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }
        .task-card-body {
            padding: 16px;
        }
        .task-info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .priority-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .priority-high { background: #fee2e2; color: #dc2626; }
        .priority-medium { background: #fef3c7; color: #d97706; }
        .priority-low { background: #e0f2fe; color: #0284c7; }
        
        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .status-pending { 
            background: #f1f5f9; 
            color: #475569; 
            font-weight: 600;
        }
        .status-in_progress { 
            background: #dbeafe; 
            color: #1d4ed8; 
            font-weight: 600;
        }
        .status-delayed { 
            background: #fee2e2; 
            color: #b91c1c; 
            font-weight: 700;
            border-left: 3px solid #dc2626;
            animation: subtlePulse 2s infinite;
        }
        @keyframes subtlePulse {
            0% { background: #fee2e2; }
            50% { background: #ffc8c8; }
            100% { background: #fee2e2; }
        }
        
        .stat-card.delayed-card .number {
            color: #dc2626;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
        }
        .loading {
            text-align: center;
            padding: 60px;
            color: #94a3b8;
        }
        
        .task-card.delayed-task {
            border-left: 4px solid #dc2626;
            background: #fffbfb;
        }
    </style>
</head>
<body>
    <div class="task-container">
        <div class="task-stats" id="taskStats">
            <div class="stat-card"><div class="number" id="totalCount">-</div><div class="label">未完成任务总数</div></div>
            <div class="stat-card"><div class="number" id="pendingCount">-</div><div class="label">待处理</div></div>
            <div class="stat-card"><div class="number" id="inProgressCount">-</div><div class="label">进行中</div></div>
            <div class="stat-card delayed-card" id="delayedStatCard"><div class="number" id="delayedCount">-</div><div class="label">已延误</div></div>
            <div class="stat-card"><div class="number" id="completedCount">-</div><div class="label">已完成</div></div>
        </div>

        <div class="filters-bar">
            <select id="priorityFilter">
                <option value="all">全部优先级</option>
                <option value="high">高优先级</option>
                <option value="medium">中优先级</option>
                <option value="low">低优先级</option>
            </select>
            <select id="statusFilter">
                <option value="all">全部状态</option>
                <option value="pending">待处理</option>
                <option value="in_progress">进行中</option>
                <option value="delayed">已延误</option>
            </select>
            <select id="sortFilter">
                <option value="created_at">按创建时间(新到旧)</option>
                <option value="priority">按优先级(高到低)</option>
                <option value="due_date">按截止日期(近到远)</option>
            </select>
            <button id="refreshBtn">刷新</button>
        </div>

        <div id="taskListContainer" class="task-grid">
            <div class="loading">加载任务中...</div>
        </div>
    </div>

    <script>
        var currentTasks = [];
        var currentViewType = 'all';
        var currentUsername = null;
        var refreshTimer = null;

        // ========== 权限控制 ==========
        function getUserPermissions() {
            var session = localStorage.getItem('pm_user_session');
            if (session) {
                try {
                    var user = JSON.parse(session);
                    return user.permissions || [];
                } catch(e) { return []; }
            }
            return [];
        }

        function hasPermission(permission) {
            var permissions = getUserPermissions();
            return permissions.indexOf(permission) !== -1;
        }

        function getCurrentUser() {
            var session = localStorage.getItem('pm_user_session');
            if (session) {
                try {
                    var user = JSON.parse(session);
                    currentUsername = user.username;
                    return user.username;
                } catch(e) { return null; }
            }
            return null;
        }

        function updateStats(tasks) {
            var total = tasks.length;
            var pending = tasks.filter(function(t) { return t.status === 'pending'; }).length;
            var inProgress = tasks.filter(function(t) { return t.status === 'in_progress'; }).length;
            var delayed = tasks.filter(function(t) { return t.status === 'delayed'; }).length;
            
            document.getElementById('totalCount').innerText = total;
            document.getElementById('pendingCount').innerText = pending;
            document.getElementById('inProgressCount').innerText = inProgress;
            document.getElementById('delayedCount').innerText = delayed;
            
            fetchCompletedCount();
        }
        
        function fetchCompletedCount() {
            fetch('/api/projects/tasks/completed?sort_by=completed_at')
                .then(function(res) { return res.json(); })
                .then(function(res) {
                    if (res.code === 'SUCCESS') {
                        var completedCount = (res.data || []).length;
                        document.getElementById('completedCount').innerText = completedCount;
                    }
                })
                .catch(function(err) { console.error('获取已完成数量失败:', err); });
        }

        function startPolling() {
            if (refreshTimer) clearInterval(refreshTimer);
            refreshTimer = setInterval(function() {
                if (document.hidden) return;
                loadTasks(true);
            }, 10000);
        }

        function loadTasks(silent) {
            silent = silent || false;
            
            if (localStorage.getItem('need_refresh_task_center') === 'true') {
                localStorage.removeItem('need_refresh_task_center');
            }
            
            var priority = document.getElementById('priorityFilter').value;
            var status = document.getElementById('statusFilter').value;
            var sortBy = document.getElementById('sortFilter').value;
            
            // 权限控制：如果没有查看所有项目的权限，强制使用 'my' 视图
            var effectiveViewType = currentViewType;
            if (!hasPermission('view_all_projects') && currentViewType === 'all') {
                effectiveViewType = 'my';
            }
            
            var url = '';
            if (effectiveViewType === 'my') {
                url = '/api/projects/tasks/my?username=' + encodeURIComponent(currentUsername) + '&sort_by=' + encodeURIComponent(sortBy) + '&exclude_completed=true';
                if (priority !== 'all') url += '&priority=' + priority;
                if (status !== 'all') url += '&status=' + status;
            } else if (effectiveViewType === 'completed') {
                url = '/api/projects/tasks/completed?sort_by=' + encodeURIComponent(sortBy);
                if (priority !== 'all') url += '&priority=' + priority;
            } else {
                url = '/api/projects/tasks/all?sort_by=' + encodeURIComponent(sortBy) + '&exclude_completed=true';
                if (priority !== 'all') url += '&priority=' + priority;
                if (status !== 'all') url += '&status=' + status;
            }
            
            fetch(url)
                .then(function(res) { return res.json(); })
                .then(function(res) {
                    if (res.code === 'SUCCESS') {
                        var newTasks = res.data || [];
                        if (effectiveViewType !== 'completed') {
                            newTasks = newTasks.filter(function(task) { return task.status !== 'completed'; });
                        }
                        var needUpdate = false;
                        if (currentTasks.length !== newTasks.length) {
                            needUpdate = true;
                        } else {
                            for (var i = 0; i < currentTasks.length; i++) {
                                if (currentTasks[i].id !== newTasks[i].id || 
                                    currentTasks[i].status !== newTasks[i].status) {
                                    needUpdate = true;
                                    break;
                                }
                            }
                        }
                        if (needUpdate || !silent) {
                            currentTasks = newTasks;
                            renderTaskList(currentTasks);
                            updateStats(currentTasks);
                        }
                    } else if (!silent) {
                        document.getElementById('taskListContainer').innerHTML = '<div class="empty-state">加载失败: ' + (res.detail || '未知错误') + '</div>';
                    }
                })
                .catch(function(err) {
                    if (!silent) {
                        document.getElementById('taskListContainer').innerHTML = '<div class="empty-state">网络错误: ' + err.message + '</div>';
                    }
                });
        }

        function getStatusText(status) {
            var statusMap = {
                'pending': '待处理',
                'in_progress': '进行中',
                'delayed': '已延误',
                'completed': '已完成'
            };
            return statusMap[status] || status;
        }

        function getPriorityText(priority) {
            var priorityMap = {
                'high': '高',
                'medium': '中',
                'low': '低'
            };
            return priorityMap[priority] || priority;
        }

        function renderTaskList(tasks) {
            var container = document.getElementById('taskListContainer');
            if (!tasks || tasks.length === 0) {
                container.innerHTML = '<div class="empty-state">暂无未完成任务，干得漂亮！</div>';
                return;
            }
            
            var html = '';
            for (var i = 0; i < tasks.length; i++) {
                var task = tasks[i];
                var priorityClass = '';
                var priorityText = getPriorityText(task.priority);
                switch (task.priority) {
                    case 'high': priorityClass = 'priority-high'; break;
                    case 'medium': priorityClass = 'priority-medium'; break;
                    default: priorityClass = 'priority-low';
                }
                
                var statusClass = '';
                var statusText = getStatusText(task.status);
                switch (task.status) {
                    case 'pending': statusClass = 'status-pending'; break;
                    case 'in_progress': statusClass = 'status-in_progress'; break;
                    case 'delayed': statusClass = 'status-delayed'; break;
                    default: statusClass = 'status-pending';
                }
                
                var isDelayed = task.status === 'delayed';
                var delayClass = isDelayed ? 'delayed-task' : '';
                var delayIcon = isDelayed ? '⚠️ ' : '';
                
                html += '<div class="task-card ' + delayClass + '" onclick="openTaskDetailInNewTab(' + task.id + ')">' +
                    '<div class="task-card-header">' +
                    '<div class="task-title">' + delayIcon + escapeHtml(task.title) + '</div>' +
                    '<div class="task-meta">' +
                    '<span>' + escapeHtml(task.project_name) + '</span>' +
                    '<span class="priority-badge ' + priorityClass + '">' + priorityText + '优先级</span>' +
                    '<span class="status-badge ' + statusClass + '">' + statusText + '</span>' +
                    '</div></div>' +
                    '<div class="task-card-body">' +
                    '<div class="task-info-row">' +
                    '<span>指派人: ' + escapeHtml(task.assignee || '未指派') + '</span>' +
                    '<span>截止: ' + (task.due_date_str || '未设置') + '</span>' +
                    '</div>' +
                    '<div class="task-info-row">' +
                    '<span>创建: ' + (task.created_at_str || '-') + '</span>' +
                    (isDelayed ? '<span style="color: #dc2626; font-weight: 600;">已超期</span>' : '') +
                    '</div></div></div>';
            }
            container.innerHTML = html;
        }

        function openTaskDetailInNewTab(taskId) {
            window.open('/task-detail?task_id=' + taskId, '_blank');
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str).replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        window.setTaskView = function(viewType) {
            currentViewType = viewType;
            var statusFilter = document.getElementById('statusFilter');
            if (viewType === 'completed') {
                statusFilter.innerHTML = '<option value="all">全部状态</option><option value="completed">已完成</option>';
            } else {
                statusFilter.innerHTML = '<option value="all">全部状态</option><option value="pending">待处理</option><option value="in_progress">进行中</option><option value="delayed">已延误</option>';
            }
            loadTasks(false);
        };

        getCurrentUser();
        
        currentViewType = 'all';
        var statusFilter = document.getElementById('statusFilter');
        statusFilter.innerHTML = '<option value="all">全部状态</option><option value="pending">待处理</option><option value="in_progress">进行中</option><option value="delayed">已延误</option>';
        
        loadTasks(false);
        startPolling();
        
        document.getElementById('refreshBtn').addEventListener('click', function() {
            loadTasks(false);
        });
        document.getElementById('priorityFilter').addEventListener('change', function() {
            loadTasks(false);
        });
        document.getElementById('statusFilter').addEventListener('change', function() {
            loadTasks(false);
        });
        document.getElementById('sortFilter').addEventListener('change', function() {
            loadTasks(false);
        });
    </script>
</body>
</html>
